<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">VaultOAuth</div>
      <div class="actions">
        <button id="scanBtn" class="icon-btn" title="Scan from screen">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <rect x="8" y="8" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
          </svg>
        </button>
        <button id="addBtn" class="icon-btn" title="Add manually">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
    </header>

    <div class="search-wrap">
      <input id="search" type="text" placeholder="Search" spellcheck="false">
    </div>

    <main id="list" class="list"></main>

    <div id="empty" class="empty">
      <div class="empty-icon">
        <svg viewBox="0 0 24 24" width="38" height="38">
          <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2Zm0 15a1 1 0 1 1 1-1 1 1 0 0 1-1 1Zm1-4.5V14h-2v-2.5c0-1.5 2-1.6 2-3A1.5 1.5 0 0 0 11.5 7 1.6 1.6 0 0 0 10 8.5H8A3.5 3.5 0 1 1 13 12Z" fill="currentColor"/>
        </svg>
      </div>
      <p>No accounts yet</p>
      <span>Click the scan button or add one manually</span>
    </div>

    <div id="toast" class="toast"></div>
  </div>

  <div id="modal" class="modal">
    <div class="modal-card">
      <h3 id="modalTitle">Add account</h3>
      
      <div class="modal-header-img">
        <div id="modalAvatar" class="avatar avatar-empty" style="width:42px;height:42px;font-size:18px;background:var(--surface);">?</div>
        <label for="inImage" class="upload-btn">Upload Logo</label>
        <input id="inImage" type="file" accept="image/png, image/jpeg, image/svg+xml" style="display: none;">
      </div>

      <label>Issuer / Service</label>
      <input id="inIssuer" type="text" placeholder="e.g. GitHub" spellcheck="false">
      <label>Account</label>
      <input id="inAccount" type="text" placeholder="you@example.com" spellcheck="false">
      <label>Secret (Base32)</label>
      <input id="inSecret" type="text" placeholder="JBSWY3DPEHPK3PXP" spellcheck="false">
      
      <div class="modal-actions">
        <button id="cancelBtn" class="btn ghost">Cancel</button>
        <button id="saveBtn" class="btn">Save</button>
      </div>
    </div>
  </div>

  <script src="lib/otpauth.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
